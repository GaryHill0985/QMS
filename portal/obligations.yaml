# portal/obligations.yaml — SESC-REG-02 Assurance Calendar, held as data.
#
# Transcribed from SESC-REG-02 v1.0, signed 17 August 2026. The PDF remains the
# controlled copy; this file is the machine-readable form the portal is built
# from. If the two ever disagree, the PDF wins and this file is wrong.
#
# RECONCILIATION NOTE — raised as finding F10.
#   SESC-REG-02 8(a) states there are "twenty-nine recurring obligations" and
#   that eleven have never been done. The tables at 3 to 6 contain 23 scheduled
#   obligations (12 annual, 2 six-monthly, 6 quarterly, 3 monthly) and 7 lists
#   6 event-driven triggers. 23 + 6 = 29, so the total reconciles only if the
#   event-driven triggers are counted as recurring obligations, which 7 says
#   they are not.
#   On never-done: every quarterly (6), every monthly (3) and both six-monthly
#   (2) is 11 on its own, and 8(a) then adds "and four of the annual ones",
#   which makes 15, not 11. The portal reports what the tables say: 15 of 23
#   scheduled obligations have never been carried out.
#   Correct SESC-REG-02 8(a) at the next reissue.

source: SESC-REG-02 Assurance Calendar v1.0, issued 17 August 2026
operated_by: >
