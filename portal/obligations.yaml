# ---------------------------- EVENT-DRIVEN -----------------------------
# No date, but they must not be forgotten. SESC-REG-02 7.

event_driven:

  - ref: OB-E01
    trigger: >
      A significant change — new system, new premises, new category of customer
      information, material change in what the business does
    action: >
      Re-run the information asset and information security risk assessments; do
      not wait for the annual date
    source: POL-13 Annex J1 187
    owner: Managing Director

  - ref: OB-E02
    trigger: Any security or data protection incident
    action: >
      Incident record at POL-13 Annex D; customer told within 24 hours; a
      Government site authority told immediately; ICO within 72 hours where
      personal data is involved; the plan reviewed afterwards
    source: POL-13 Annex D7, POL-14, POL-15 37
    owner: Managing Director

  - ref: OB-E03
    trigger: A leaver, or a change of role
    action: >
      Leaver process executed on the last working day and signed off; access,
      keys, passes and credentials withdrawn; download activity around the
      departure reviewed
    source: POL-13 Annex A2, Annex C4
    owner: Accounts Manager

  - ref: OB-E04
    trigger: >
      A new starter, or a subcontractor attending a Government site for the
      first time
    action: >
      Induction, Acceptable Use Policy signed, and the classified information
      element of the security briefing before the first visit
    source: POL-13 52, Annex L8
    owner: Contracts Manager

  - ref: OB-E05
    trigger: An invocation of the Business Continuity Plan
    action: Annex D invocation record; the plan reviewed after the incident; actions raised
    source: POL-15 27, 101(a)
    owner: Managing Director

  - ref: OB-E06
    trigger: A change to any IT system or service
    action: Change record at POL-13 9; consider whether a risk assessment or a DPIA is needed
    source: POL-13 36
    owner: Managing Director

# Three things SESC-REG-02 9 says are added when certification is sought, and
# none of which exists. The portal shows these as the gap they are.
not_yet_in_the_calendar:
  - obligation: Internal audit programme covering every clause on a defined cycle
    standard_clause: "9001 9.2 / 14001 9.2 / 45001 9.2"
    status: does not exist
  - obligation: Management review at a defined interval, with defined inputs and outputs
    standard_clause: "9001 9.3 / 14001 9.3 / 45001 9.3"
    status: >
      Does not exist. No management review has been minuted since 10 January 2023.
  - obligation: >
      Nonconformity and corrective action log, distinct from the action tables in
      the individual registers
    standard_clause: "9001 10.2 / 14001 10.2 / 45001 10.2"
    status: >
      Does not exist. No log of the Employer's own has been opened before
      31 August 2026.
