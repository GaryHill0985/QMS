# portal/documents.yaml — the legacy document estate.
#
# These are the twenty-one signed documents and the registers, records and
# templates issued alongside them. They live OUTSIDE this repository, as branded
# PDFs, and have not been migrated into it. Until a document is migrated it has
# no front matter, so it declares no clauses, so it contributes NOTHING to
# clause coverage. That is deliberate.
#
#   Control data below is read off the Evidence Pack document register, which
#   itself extracts it from the PDF control table with pdftotext. A null value
#   means the value could not be extracted, NOT that the document lacks it.
#
#   clause_map: pending  means exactly that. No clause is claimed for any of
#   these documents. Claiming clauses from a document title is how a padded
#   clause map produces a green gap report over an empty system.
#   See CLAUDE.md 7.
#
# NOT a controlled register. If it should become SESC-REG-07 Document Register,
# say so and it will be moved to registers/ with front matter and validated.

meta:
  source: Evidence Pack document register, built 18 August 2026
  extraction: pdftotext of the page-1 control table
  caveat: >
    Document owner could not be extracted for any document. The value exists in
    each PDF control table; the Evidence Pack builder did not capture it. It is
    reported by the portal as a data gap rather than guessed at.

series_meaning:
  POL: Policy
  PRO: Procedure
  WI: Work instruction
  REG: Register
  FRM: Form
  REC: Record
  TPL: Record template
  CAP: Capability sheet
  CRP: Carbon reduction plan
  IMS: Annex SL spine

