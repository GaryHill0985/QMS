# portal/actions.yaml — one action list, from four sources.
#
# Blockers, open decisions and findings all resolve to the same thing: somebody
# has to do something by a date. They are held in one list so that nobody has to
# read three tables to find out what is owed.
#
# Sourced from SESC-IMS-Master-Register.md v1.0 (18 Aug 2026) sections 3, 4, 5
# and CLAUDE.md 10. If the register moves, this file is stale — the portal
# prints the register version it was built from on every page.

source_register: SESC-IMS-Master-Register.md v1.1, 18 August 2026

# internal: true keeps an item out of the auditor and contributor builds.
# Commercial decisions and the project's own management are not an auditor's
# business. Nothing that bears on conformity is marked internal.

