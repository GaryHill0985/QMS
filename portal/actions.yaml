      Simon Davies FCCA of Rapture Accounts Limited confirmed 17 August 2026.
      Twenty documents still carry a blank adviser row and their branded PDFs
      must be rebuilt. A name typed into a .docx does not reach a PDF already
      rendered. NINE of those documents route an actual control through that
      person, so in those nine the blank row is not cosmetic — the control does
      not operate.
    internal: false

  - ref: B2
