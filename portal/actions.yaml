    due: 2026-08-25
    status: open
    severity: medium
    detail: >
      Recorded as off on 17 August 2026. Five minutes of work. Nobody has
      confirmed it since. An unverified control is an absent control.
    internal: false

  # ------------------------------ DECISIONS ------------------------------
  # Mirrors SESC-IMS-Master-Register.md section 4. The register is the source.
  # Re-run the build after it changes; this file goes stale, it does not lead.

  - ref: D2
    kind: decision
    title: Choose the certification body
    owner: Managing Director
    status: open
    severity: high
    detail: >
      Three written quotes. Ask in writing: "Have you completed your UKAS
      accreditation extension for ISO 14001:2026, and if not, which tranche and
      what decision date?" Also ask for the body's own effective-personnel
      calculation, for SSIP deemed-to-satisfy inside the scope, and for how much
      live operating history it requires before Stage 2 — neither figure the
      project holds for that is sourced (F13).
    internal: true

  - ref: D3
    kind: decision
    title: Internal auditor — train or buy
    owner: Managing Director
    status: open
    severity: medium
    detail: Train two, buy in the first cycle for independence.
    internal: true

  - ref: D6
    kind: decision
    title: Buy the standards
    owner: Managing Director
    due: 2026-08-31
    status: open
    severity: high
    detail: >
      ISO 14001:2026 not held in any form. ISO/IEC 27001:2022 not held in any
      form. The 9001:2015 PDF held is licensed to Unitspark Ltd, single user.
      Buy own copies — and ISO/IEC 27002:2022 with 27001, because without 27002
      the Annex A control set cannot be applied.
    internal: true

  - ref: D8
    kind: decision
    title: The design carve-out for the standard quotation
    owner: Managing Director
    status: open
    severity: critical
    detail: >
      THE ISO 9001 SCOPE TURNS ON THIS. The capability statements and the
