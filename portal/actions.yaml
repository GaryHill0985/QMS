      Every 14001 clause reference held is carried from the withdrawn :2015
      edition, which was withdrawn on 15 April 2026. standards/iso14001-2026.yaml
      is marked verified:false throughout and must not be quoted to a customer or
      an auditor. Buy the edition before writing any EMS document.
    internal: false

  - ref: B5
    kind: blocker
    title: No internal auditor is trained
    owner: Managing Director
    due: 2026-11-30
    status: open
    severity: high
