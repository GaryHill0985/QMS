# portal/actions.yaml — one action list, from five sources.
#
# Blockers, open decisions, findings, the gaps CLAUDE.md 10 names, and the
# records SESC-IMS-00 Part 10 says do not yet exist all resolve to the same
# thing: somebody has to do something by a date. They are held in one list so
# that nobody has to read five tables to find out what is owed.
#
# Sourced from SESC-IMS-Master-Register.md v1.17 (7 Oct 2026) sections 2l, 3, 4
# and 5, CLAUDE.md 10, and SESC-IMS-00 v0.1 Part 10 (a)-(w). If the register
# moves, this file is stale — the portal prints the register version it was
# built from on every page. Resynced 7 October 2026 (it had been sourced from
# v1.4 since 18 August 2026).
#
# Closed items are kept, marked closed, so the list shows what moved; the
# portal does not print them.

source_register: SESC-IMS-Master-Register.md v1.17, 7 October 2026

# internal: true keeps an item out of the auditor and contributor builds.
# Commercial decisions and the project's own management are not an auditor's
# business. Nothing that bears on conformity is marked internal.

