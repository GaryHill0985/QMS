  - ref: D11
    kind: decision
    title: >
      Are fire doors and mould & damp remediation named trades for the
      certificate scope
    owner: Managing Director
    status: open
    severity: critical
    detail: >
      IT CHANGES THE SCOPE STATEMENT. The project instructions describe the
      business as M&E, roofing, mould and damp remediation, fire doors and
      renewables. The signed policies say roofing, building fabric, mechanical,
      electrical and renewable energy works, and name neither. A
      Building-Safety-Act-adjacent trade omitted from a scope statement is a
      finding. Recorded at SESC-IMS-04 paragraph 16.
    internal: false

  - ref: D12
    kind: decision
