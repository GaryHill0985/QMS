      The sole-director problem again. CLAUDE.md requires two named humans, but
      required approvals on the ruleset is 0 because GitHub will not let a person
      approve their own pull request and 1 would deadlock a solo repository. The
      pull request gate and the visible diff exist; the second human does not.
      See F15.
    internal: true

