id: SESC-REG-05
title: Interested Parties Register
version: "0.1"
status: draft
owner: Chief Operating Officer
approver: Managing Director
issued: 2026-08-18
next_review: 2027-08-18
review_frequency_months: 12
classification: internal
clauses:
  iso9001:  ["4.2"]
  iso14001: ["4.2", "6.1.3"]
  iso45001: ["4.2", "6.1.3"]
parent_document: SESC-IMS-04

notes:
  - >
    A party is relevant if its requirement, unmet, would affect the Employer's ability to
    consistently provide conforming work, to prevent harm to workers, or to fulfil its
    compliance obligations. Parties that merely exist are not listed.
  - >
    'obligation: legal' rows feed the compliance obligations register required by
    ISO 14001 6.1.3 and ISO 45001 6.1.3. That register does not yet exist — the one held
    is dated 2020 with dead drive links.
  - >
    Every row must name where the evidence sits, or say plainly that it does not exist.
    A requirement with no evidence line is a finding waiting to happen.

