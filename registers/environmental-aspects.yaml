    controls: SESC-POL-08 paragraphs 66(a)–(c) (telematics, route planning, fuel and mileage monitoring); SESC-POL-05 paragraph 72 (journey planning); SESC-POL-08 paragraph 41(d) (no idling); SESC-CRP-01
