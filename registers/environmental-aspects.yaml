# SESC-REG-10 Environmental Aspects and Impacts Register.
#
# Reference taken from CLAUDE.md 5 on 26 October 2026 (Master Register 6 item 4; SESC-IMS-00
# Part 10 (f); CLAUDE.md 10). THE DEFINING ISO 14001 DOCUMENT AND, UNTIL THIS DRAFT, THE
# HIGHEST-PRIORITY GAP IN THE SYSTEM.
#
# Why it exists. ISO 14001 clause 6.1.2 requires the Employer to determine the environmental
# aspects of its activities, products and services that it can control and those it can
# influence, and their associated environmental impacts, considering a life cycle perspective;
# to take into account change, and abnormal conditions and reasonably foreseeable emergency
# situations; to determine, by established criteria, which aspects are significant; to
# communicate the significant aspects; and to maintain documented information of the aspects
# and impacts, the criteria, and the significant aspects. ISO 14001 is read here from
# standards/iso14001-2026.yaml, which is marked verified: false throughout: the 2026 edition
# has not been read by anyone on this project. Under D27 (26 October 2026) this register is
# drafted to the clause structure held, written 2026-ready, and is re-read against the 2026
# text when the standard is bought. Nothing here is to be quoted to a customer or an auditor as
# a 2026 clause requirement until then.
#
# What it replaces. Nothing of the Employer's own. The register previously held belonged to a
# landscaping firm — it named an unconnected individual, badgers and herbicides — and was
# withdrawn under SESC-POL-08 paragraph 14: "Any aspects register that does not describe the
# work SESC actually carries out must not be used. The register is rebuilt from our own
# activities and is owned by the Environmental Manager." This is that rebuild. NOT ONE ROW of
# the withdrawn register, or of any template, was read for content; the aspects below are the
# ones SESC-POL-08 paragraph 12 names as "what we actually do", the emergencies SESC-POL-08
# paragraph 37 names as reasonably foreseeable, and the activities in the scope statement at
# SESC-IMS-04 paragraph 14, organised by activity and by life cycle stage.
#
# What it claims. ISO 14001 6.1.2 only, as documented information maintained. It does not claim
# 6.1.3 (SESC-REG-09), 6.1.4 or 6.2 (SESC-IMS-06), 8.1 operational control (the controls are
# CITED here to SESC-POL-08 and the RAMS; the register does not itself control anything), or
# 9.1 (no aspect has been measured). Nothing is claimed from ISO 9001 or ISO 45001: an aspect is
# not a hazard, and OH&S hazards are identified under SESC-POL-05 A1 and the job RAMS.
#
# What each row holds. The activity and the life cycle stage; the aspect (what the activity does
# that interacts with the environment) and the impact (the change to the environment that
# results); the condition under which it arises — normal, abnormal or emergency; whether the
# Employer controls it or can only influence it; the proposed significance scores and result;
# the control that applies, cited to the signed paragraph or the RAMS; the compliance
# obligation topic in SESC-REG-09; the interested party in SESC-REG-05; the objective area in
# SESC-IMS-06 where one is proposed; and the evidence that the control operates, each record
# marked held or not yet held with a date. EVERY SCORE IS PROPOSED. The Environmental Manager
# confirms or revises each score, and the Managing Director approves the result, before any
# aspect is communicated as significant.
#
# What is NOT here. No quantity — litres of fuel, tonnes of waste, kWh — is stated, because the
# environmental data set at SESC-POL-08 E15 does not yet exist (SESC-IMS-04 Part 8 (j); the
# Scope 1 figures in SESC-CRP-01 are the exception and are cited where relevant). Scores are
# therefore judgements on the nature and scale of the Employer's work as the signed documents
# describe it, not on measured data, and the first data set is a review trigger. Headcount,
# turnover and the professional indemnity limit are stated nowhere in this register.

design_rules:
  - >
    ONE ROW PER ASPECT, UNDER THE ACTIVITY THAT PRODUCES IT. An aspect that arises in several
    activities is one row with every activity listed, so that a control applies once.
  - >
    EVERY ROW IS SESC'S OWN. The activities are those at SESC-IMS-04 paragraph 14; the aspects
    those SESC-POL-08 paragraphs 12 and 37 name; nothing is carried from a template or from the
    withdrawn register. A row that would describe work the Employer does not do is not here.
  - >
    SIGNIFICANCE IS DECIDED BY THE CRITERIA BELOW, NOT BY WHO WROTE THE ROW. The criteria are
    documented so that a second person reaches the same answer from the same facts.
  - >
    A CONTROL IS CITED, NEVER RESTATED. The row points at the SESC-POL-08 paragraph, the RAMS
    section or the SESC-POL-05 arrangement that is the control. Where no control exists, the row
    says "none documented" and raises the gap.
  - >
    EVIDENCE IS A RECORD, NOT A SENTENCE. A row may not show a control as operating on the
    strength of a policy paragraph. Where the record does not exist the row says so with a date.
  - >
    LIFE CYCLE PERSPECTIVE. Each row names the stage: procurement (what is bought and from where),
    delivery (the Employer's own work on site and at Unit 19), use (the installed system in the
    customer's hands over its life), end of life (removal and disposal). The Employer controls
    delivery; it influences procurement, use and end of life through specification and advice.

significance_method:
  clause: ISO 14001 6.1.2 (unverified edition)
  who: >
    Scored by the Environmental Manager, reviewed with the appointed competent adviser, approved
    by the Managing Director. The scores in this draft are PROPOSED by the author from the signed
    documents and await that confirmation.
  severity: >
    1 — negligible: no measurable change to the environment; 2 — minor: localised, short-lived,
    recoverable without intervention; 3 — moderate: localised harm needing clean-up or
    remediation, or a measurable contribution to a cumulative impact (fuel, waste, energy);
    4 — major: harm to a sensitive receptor (a chalk stream, an aquifer, a protected species, a
    neighbour's health), regulatory action likely, or a large cumulative contribution; 5 — severe:
    irreversible or widespread harm, prosecution likely.
  likelihood: >
    For NORMAL conditions, frequency: 1 — rare, less than yearly; 2 — occasional, a few times a
    year; 3 — regular, monthly on some jobs; 4 — frequent, weekly or on most jobs; 5 — continuous,
    every job every day. For ABNORMAL and EMERGENCY conditions, probability of occurrence in a
    year given the controls in place: 1 — remote; 2 — unlikely; 3 — possible; 4 — likely;
    5 — almost certain.
  score: severity multiplied by likelihood, 1 to 25.
  significant_if: >
    Any of — (a) score of 10 or more; (b) a legal requirement in SESC-REG-09 attaches directly to
    the aspect (duty of care, F-Gas, hazardous waste, protected species, oil storage, statutory
    nuisance); (c) an emergency condition with potential to reach a drain, watercourse, aquifer or
    protected species, whatever the score; (d) a relevant interested party in SESC-REG-05 has
    stated a requirement about it (a customer's or Government establishment's environmental
    conditions; the Carbon Reduction Plan commitment). A row meeting (b), (c) or (d) is significant
    at any score, and the reason is recorded.
  not_significant: >
    A row scoring below 10 that meets none of (b) to (d). It stays on the register, is reviewed
    annually, and is not communicated as significant.
  communication: >
    Significant aspects are communicated to every person working for the Employer at induction
    and by toolbox talk (SESC-POL-08 paragraph 88) and are carried into every job's RAMS
    environmental section (SESC-POL-08 paragraph 29(a)). No communication has yet taken place
    under this register.
  review: >
    Annually; on every trigger above; and the scores re-tested against measured quantities when
    the environmental data set exists.

status_vocabulary:
  condition: [normal, abnormal, emergency]
  control_or_influence: [control, influence]
  life_cycle_stage: [procurement, delivery, use, end of life]
  result: [significant, not significant]
  evidence_status: [held, not yet held, nil return]

owners:
  note: >
    Owners are roles. The Contracts Manager holds the Environmental Manager appointment
    (SESC-POL-08 O2; SESC-IMS-04 paragraph 11). Site Supervisors apply the controls at the
    workface (SESC-POL-08 O3). The Managing Director approves the register and sets the
    environmental objectives (SESC-POL-08 O1).

