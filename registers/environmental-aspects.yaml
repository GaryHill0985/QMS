    reg05: Customers and Government establishments with net-zero requirements; the regulator
    objective_area: SESC-IMS-06 — fuel and Scope 1 emissions reduction aligned to SESC-CRP-01
    evidence:
      - record: SESC-CRP-01 v1.0 measured Scope 1 fuel data, 2023 baseline and 2025 reporting year
        status: held
      - record: Telematics reports and fuel card data for the current year, consolidated in the E15 data set
        status: not yet held
        due: 2026-12-31
        note: SESC-POL-08 paragraph 87 — collected monthly, consolidated annually; no data set exists (SESC-IMS-04 Part 8 (j))
