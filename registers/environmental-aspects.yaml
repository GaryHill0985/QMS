revision_history:
  - version: "0.1"
    date: 2026-10-26
    author: G A Hill (drafted by Claude)
    change: >
      First draft, as workstream 4 of the Master Register (6 item 4) and SESC-IMS-00 Part 10 (f),
      under decision D27 of 26 October 2026 that the register is drafted to the clause structure
      held, written 2026-ready, without waiting for the purchase of ISO 14001:2026. Twenty-eight
      aspects across ten activity groups, every one taken from the Employer's own activities as
      SESC-IMS-04 paragraph 14 and SESC-POL-08 paragraphs 12 and 37 describe them, with a life
      cycle stage, a condition, a documented significance method and proposed scores. Twenty-four
      proposed significant, four not. Every control cited to a signed paragraph; every evidence
      record marked held or not yet held with a date. Written after reading every page of
      SESC-POL-08 v1.1, SESC-POL-05 v1.1 and SESC-POL-16 v1.2. No row, score or control was
      taken from the withdrawn landscaping register, from any template or from any other
      organisation's document. Not approved; no score confirmed; nothing communicated.
