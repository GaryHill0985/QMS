    significant aspects are all here. Read from the unverified 2026 map; the determination is to
    be re-read against the 2026 text when the standard is bought (D27). Every score is proposed and
    unconfirmed; the Employer's determination of significance exists only when the Environmental
    Manager has confirmed the scores and the Managing Director has approved this register. Until
    then the gap report may show the artefact as present and the determination as not yet made.
