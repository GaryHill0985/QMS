# SESC-REG-09 Compliance Obligations Register.
#
# Reference taken from CLAUDE.md 5 on 12 October 2026 (Master Register 6 item 5; SESC-IMS-00 Part 10
# (g); portal/actions.yaml G5).
#
# Why it exists. ISO 14001 clause 6.1.3 and ISO 45001 clause 6.1.3 require the Employer to determine
# and have access to the legal requirements and other requirements that apply to its environmental
# aspects and its OH&S hazards, to determine how they apply, and to keep documented information of
# them; clause 9.1.2 of both requires a periodic, documented evaluation of compliance. ISO 45001 6.1.3
# is a dual maintain-AND-retain clause. ISO 14001 is read here from standards/iso14001-2026.yaml,
# which is marked verified: false throughout: the 2026 edition has not been read by anyone on this
# project, and these clause numbers are not to be quoted to a customer or an auditor until it has.
#
# What it replaces. The Employer's earlier legal register is dated 2020 and carried links to a Z:\
# network drive that no longer exists (CLAUDE.md 10). SESC-POL-19 v1.1 paragraph 86 already states
# that any such register "is superseded by Annex A and must be withdrawn from use". The 2020
# register was looked for on 12 October 2026 in the three sources this project uses (the repository,
# ~/Documents/SESC/ISO/ and the Drive record-capture folder) and WAS NOT FOUND in any of them. Nothing
# is carried from it. SESC-POL-19 Annex A (signed 16 August 2026, 30 rows, product and installation
# law) is the only issued legal register the Employer holds today; every one of its rows has been
# re-evaluated against the Employer's activities and appears here with its POL-19 citation. On the
# Managing Director's approval this register becomes the Employer's single compliance obligations
# register for all three standards; SESC-POL-19 Annex A is then amended, at POL-19's next revision,
# to point here rather than to carry its own table. Until that signature POL-19 Annex A remains the
# issued document and this register is a draft.
#
# What it claims. ISO 14001 6.1.3 and ISO 45001 6.1.3, as the determination of legal and other
# requirements, maintained here. ISO 14001 9.1.2 and ISO 45001 9.1.2 are claimed ONLY because this
# register carries a documented evaluation method (evaluation_method below); NO EVALUATION OF
# COMPLIANCE HAS YET BEEN CARRIED OUT, every row reads last_evaluation: none yet, and the first is
# due 30 November 2026 (SESC-IMS-00 Part 10 (g)). Nothing is claimed from ISO 9001: this register
# does not address a 9001 clause. 9001 clause 9.1.2 is customer satisfaction, which is SESC-IMS-00
# Part 10 (t).
#
# What each row holds. The source and its exact title as the issuing body publishes it, read on
# 12 October 2026 from legislation.gov.uk, gov.uk, hse.gov.uk, ico.org.uk or the scheme's own site
# (source_url); who imposes it; the activities, trades and site types it applies to — roofing,
# building fabric, mechanical, electrical, renewables, and mould and damp remediation, which is in
# scope as remediation only (D11); fire doors are not a trade of the Employer (D11); what it requires
# of the Employer; the arrangement that meets it, cited to the signed document and paragraph; the
# evidence that the Employer complies, each record marked held, not yet held (with a date) or nil
# return; the SESC-REG-05 interested-party requirement it belongs to; the SESC-REG-02 scheduled check
# where one exists; the owner (a role); the review frequency; and the date of the last evaluation of
# compliance, which for every row is none yet.
#
# Registration, licence, scheme and certificate numbers are stated here ONLY as the signed documents
# record them (SESC-POL-05 Annex C and SESC-POL-16 Annex C, verified against the certificates by
# G A Hill on 16 August 2026; SESC-POL-19 Annex A). The certificates themselves, and SESC-REG-04
# Licence and Accreditation Register, are not among the three sources this project reads (Master
# Register 2n: REG-02, REG-03, REG-04 were not copied into Signed/), so no number here has been
# read off an issuing body's document in this workstream, and none has been checked against a
# public register. Where a signed document records a position as NOT VERIFIED, so does this register.
#
# Structure. The column set and the idea of typing each row by topic were taken from the legal
# register template in folder "14. Legal and Regulatory Requirements" of the shared ISO folder on
# the Google Drive (James Milligan's template set), read once, read-only, on 12 October 2026 for
# that purpose and nothing else. NOT ONE ROW OF IT WAS COPIED. Every obligation below was determined
# from the Employer's own signed documents and SESC-REG-05, and re-evaluated against what the
# Employer actually does. Nothing here carries a POW, ITC, LARC, HCPL or Unitspark reference.
#
# Dates. Where a signed document already gives the date by which an absent record is created, that
# date is carried here even where it has passed; a passed date is recorded as overdue, not re-dated.
# Dates this register proposes for the first time are marked proposed, for the owner to confirm.
# Headcount, turnover and the professional indemnity limit are stated nowhere in this register.

design_rules:
  - >
    ONE ROW PER OBLIGATION. A row names the instrument exactly as its issuing body does, says what
    it requires of the Employer in operational terms, and points at the signed paragraph that meets
    it. A row with no arrangement says so. A row with no evidence says so and gives a date.
  - >
    NOTHING IS CARRIED FROM ANOTHER ORGANISATION'S REGISTER. The 2020 register was not found; James
    Milligan's template supplied column headings and a topic list only; SESC-POL-19 Annex A, the
    Employer's own signed table, was re-evaluated row by row.
  - >
    NO REGISTRATION, LICENCE, MEMBERSHIP OR CERTIFICATION IS STATED AS HELD WITHOUT A DATED DOCUMENT
    BEHIND IT. Where the only document is a signed policy's annex, the row says "as recorded at" and
    names the annex. OFTEC (expired 14 April 2026), RECC (expired 15 November 2024) and NFRC (never
    a member) are not obligations the Employer subscribes to and are recorded only at the foot.
  - >
    SCHEDULED CHECKS LIVE IN SESC-REG-02 (portal/obligations.yaml). A row points at the OB reference;
    it never restates the schedule. Interested-party requirements live in SESC-REG-05; a row points
    at the IP reference; it never restates what REG-05 holds.
  - >
    EVALUATION IS A RECORD, NOT A COLUMN. The evaluation method below produces a dated record per
    cycle; last_evaluation moves from "none yet" only when that record exists.

evaluation_method:
  clause: ISO 14001 9.1.2 (unverified edition) and ISO 45001 9.1.2
  frequency: >
    At least annually, in the quarter before the management review, and within one month of any
    change in law, scheme rule, customer requirement or scope that adds or alters a row. The first
    evaluation is due 30 November 2026 (SESC-IMS-00 Part 10 (g)).
  who: >
    The Contracts Manager, in the appointments the rows name (Environmental Manager for environmental
    rows, Health and Safety Officer for OH&S rows), with the retained external health and safety
    adviser reviewing the OH&S rows and the appointed competent adviser reviewing the environmental
    rows (SESC-POL-08 paragraphs 18 and 22; SESC-POL-05 Annex C). The Accounts Manager evaluates the
    data-protection and employment rows. The Managing Director receives the result at the management
    review.
  how: >
    For every row, in order: (1) confirm the source is still current on the issuing body's site and
    record the date checked; (2) confirm the row still applies to the Employer's activities as
    SESC-IMS-04 paragraph 14 states them; (3) read the arrangement paragraph cited and confirm it
    still describes what is done; (4) look for the evidence record named — a record that exists is
    marked held with its date, one that does not is marked not yet held with a date and an owner;
    (5) give the row one of four results: compliant (evidence held and current); compliant,
    evidence not yet held (the arrangement operates but the record does not exist — not to be
    reported to anyone as compliant); not compliant (a requirement unmet, with the nonconformity
    raised on SESC-FRM-05); not applicable (with the reason, re-tested each cycle for the threshold
    rows). A row may not be marked compliant on the strength of a policy sentence.
  record: >
    One dated evaluation record per cycle, listing every row, its result, the evidence seen and the
    actions raised; retained five years (SESC-POL-08 Annex B, compliance evaluation). Held in the
    repository as a controlled record once SESC-REC-05 is taken for it; until then as a dated note in
    Claude outputs/ is NOT sufficient — the record does not exist until it is controlled.
  outputs: >
    Nonconformities to the corrective action log (SESC-FRM-05); changes to rows by a new version of
    this register; a summary to the management review (ISO 14001 and ISO 45001 clause 9.3).
  first_evaluation_due: 2026-11-30
  evaluations_carried_out: none

clause_notes:
  iso45001_6_1_3: >
    Dual maintain-and-retain. The maintained documented information is this register. The retained
    documented information is the evaluation record; none exists. The determination is therefore
    done and the retention is not, and the gap report treats the clause as red until the first
    evaluation record exists.
  iso14001_6_1_3: >
    Read from the unverified 2026 map (standards/iso14001-2026.yaml). Claimed as determined and
    maintained; not to be quoted to a customer or an auditor until ISO 14001:2026 has been read.
  iso14001_9_1_2_and_iso45001_9_1_2: >
    Claimed only because the evaluation method above is documented. NO EVALUATION OF COMPLIANCE HAS
    BEEN CARRIED OUT UNDER ANY SYSTEM. First due 30 November 2026. Until the record exists, the gap
    report treats both clauses as red.
  iso9001: Nothing claimed. This register does not address an ISO 9001 clause.

status_vocabulary:
  evidence_status: [held, not yet held, nil return, not verified]
  position: [applies, applies — conditional, below threshold — tested annually, nil position]

owners:
  note: Owners are roles. The Contracts Manager holds the Environmental Manager, Health and Safety Officer and Quality Representative appointments (SESC-IMS-04 paragraph 11). The Accounts Manager is the Data Protection Lead (SESC-POL-14 paragraph 7).

