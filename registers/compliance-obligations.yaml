  - ref: CO-43
    topic: Waste carrier registration — and its replacement by permitting from 2027
    source: Control of Pollution (Amendment) Act 1989 (1989 c. 14), section 1; The Waste (England and Wales) Regulations 2011 (S.I. 2011/988), Part 8 regulations 25–31 and regulation 24(5)(e); gov.uk "Register as a waste carrier, broker or dealer"; The Environmental Permitting (Waste Controlling or Transporting) and Relevant Functions of Primary Authorities (Amendment) (England) Regulations 2026 (S.I. 2026/873)
    source_url: https://www.legislation.gov.uk/uksi/2011/988/regulation/24
