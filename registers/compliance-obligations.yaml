    imposed_by: legislation; regulator — Environment Agency
    position: applies
    applies_to: The Employer's vans carrying construction waste from every site; brokering or dealing where removal is arranged for a customer
    requires: >
      Today — be a registered carrier under the 1989 Act. Regulation 24(5)(e) excludes from the own-waste
      ("specified person", lower tier) category "a carrier which only transports waste produced by the
      carrier itself, except where it is construction or demolition waste", and defines construction to
      include "improvement, repair and alteration": the Employer carries construction waste, so it needs
      the full (upper tier) registration, renewed every three years (gov.uk: £130.25), with changes
      notified within 28 days. From Part 2 of S.I. 2026/873 (made 22 July 2026 per its introductory
      text; Part 2 in force at the end of twelve months beginning with that day — July 2027; the printed
      date is to be confirmed) — waste transporting in England becomes a regulated facility under the
      Environmental Permitting Regulations 2016 requiring an environmental permit or registration of an
      exempt activity; the 1989 Act ceases to apply in England; existing registrations transition under
      regulation 28. The gov.uk service page read on 12 October 2026 does not yet mention the change.
    arrangement: SESC-POL-08 v1.1 paragraph 34(a) (registration asserted, no number or tier; checked annually against the public register; changes notified within 28 days); SESC-POL-19 v1.1 Annex A row 25 (CBDL569181 — superseded, see evidence; to be corrected to CBDU663802 at POL-19 v1.2)
    evidence:
      - record: Waste carrier registration CBDU663802, upper tier — SESC SOLUTIONS LTD, company 07606236, "Carrier Dealer - Upper Tier", registered 01/10/2026, expiry 01/10/2029
        status: held
        note: >
          Registration reported received by the Chief Operating Officer on 22 October 2026 and confirmed the same
          day on the Environment Agency public register (the record below). Upper tier is the tier this row
          requires. The registration is carrier and dealer only, not broker: if removal of waste is ever arranged
          on a customer's behalf, brokering is not covered and the registration must be varied first (Environmental
          Manager to confirm whether that activity occurs). The registered address on the public register reads
          "MELBURY BUSINESS PARK, WEST MELBURY, SHAFTESBURY, SP7 0AF" with no unit number; the Employer's documents
          say Unit 19. To be checked against the lease and corrected with the Environment Agency if wrong (changes
          are notifiable within 28 days). The certificate itself is not yet filed in the three sources — see
          not_yet_held below
      - record: Public register check, dated — SESC-REC-05, 22 October 2026 (environment.data.gov.uk register of waste carriers, brokers and dealers)
        status: held
        note: >
          Query of https://environment.data.gov.uk/public-register/waste-carriers-brokers/registration/CBDU663802
          on 22 October 2026, made by Claude at the Chief Operating Officer's direction, fields recorded verbatim in
          portal/records-index.yaml SESC-REC-05. The same query of CBDL569181 (the number at POL-19 Annex A row 25)
          found it still listed as "sesc solutions", "Carrier, Broker, Dealer - Lower Tier", registered 05/02/2025,
          address "UNIT 9, MELBURY BUSINESS PARK" — a lower-tier registration, which was never sufficient for
          construction waste (regulation 24(5)(e)), now superseded by CBDU663802. Whether the Environment Agency
          has cancelled it is not shown on the register. POL-08 paragraph 34(a) requires this check annually; the
          next is due 22 October 2027 unless the S.I. 2026/873 transition overtakes it
      - record: Copy of the CBDU663802 registration certificate filed in ~/Documents/SESC/ISO/Signed/ alongside the SESC-REG-04 certificate set, and indexed in SESC-REG-04
        status: not yet held
        due: 2026-10-31
        owner: Chief Operating Officer
      - record: Confirmation from the Environment Agency that CBDL569181 is cancelled or superseded, so that only one registration for the Employer appears on the public register
        status: not yet held
        due: 2026-11-30
        owner: Environmental Manager
      - record: Transition plan for S.I. 2026/873 (permit or exempt-activity registration in place before Part 2 commences)
        status: not yet held
        due: 2027-03-31
        note: Proposed. A new obligation, not addressed in any signed document
    reg05: IP-07 (registration at the correct tier)
