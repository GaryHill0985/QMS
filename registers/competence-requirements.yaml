personal_data: false

# SESC-REG-12 Competence Requirements Register.
#
# Reference taken from CLAUDE.md 5 on 26 October 2026 (Master Register 6 item 6b; SESC-IMS-00
# Part 10 (l); action G12). Operated by SESC-PRO-06 Training, Competence and Awareness.
#
# Why it exists. Clause 7.2 is the same sentence in all three standards: determine the
# competence needed, ensure the person has it, take action where they do not, and retain the
# evidence. SESC-IMS-00 paragraph 36 says the role-based competence REQUIREMENTS will be held in
# the repository as a register once written; this is that register. The requirements are the
# Employer's, may live in git, and name no person. The EVIDENCE that a named person holds a
# requirement is personal data and lives in the Training Matrix and on SESC-FRM-03 in the
# records store under SESC-POL-14 (CLAUDE.md 8; SESC-FRM-03 design_note). Nothing here says who
# holds what.
#
# Where every row comes from. A requirement is here only because a signed SESC document, a
# scheme standard the Employer is registered to, or a legal instrument in SESC-REG-09 requires
# it, and the row cites which. NO QUALIFICATION, INTERVAL OR SCHEME RULE IS STATED FROM MEMORY
# (CLAUDE.md 2). Where a signed document states a renewal interval (manual handling three years;
# the annual refreshers) the row carries it; where it does not, the row says "to be read from
# the awarding body" and the Health and Safety Officer enters the interval from that body's own
# documentation, with the date read, before the row is relied on for a renewal date. A row that
# names a certificate, registration number or expiry does so only as SESC-POL-05 Annex C or
# SESC-POL-16 Annex C records it, verified against the certificate on 16 August 2026 — nothing
# has been re-verified in this draft.
#
# What it does NOT say. It does not say that any person holds any requirement, how many do, or
# how many have lapsed, beyond the one signed count: at 16 August 2026 the Training Matrix
# recorded twenty-two expired qualifications against twenty current (SESC-POL-05 paragraph
# 171(b)). The Training Matrix was not read in this workstream. The requirements for mould and
# damp remediation are not stated anywhere in the signed estate and the row says so. Activities
# in the generic risk assessment library for which no signed document states a competence
# requirement are listed at the end as gaps, not invented.
#
# What it claims. 7.2 of all three standards, as the maintained statement of the competence
# determined — the first of the clause's four requirements. The other three (ensure, act,
# retain) are SESC-PRO-06's and the Training Matrix's, and the retained evidence does not yet
# exist in any indexed form. 7.3 is SESC-PRO-06's.

design_rules:
  - >
    ONE ROW PER REQUIREMENT, listing every role it applies to. A role's full requirement set is
    every row that names it.
  - >
    EVERY ROW CITES ITS SOURCE — the signed paragraph, the scheme standard or the SESC-REG-09
    obligation. No source, no row.
  - >
    INTERVALS ARE READ, NOT REMEMBERED. "To be read from the awarding body" is an honest entry;
    a number nobody read is not.
  - >
    NO NAMES, NO COUNTS beyond what a signed document states. The holders are on the Training
    Matrix in the records store.
  - >
    THE EVIDENCE COLUMN SAYS WHAT SHOWS THE REQUIREMENT IS MET, and SESC-FRM-03's
    competence_demonstrated vocabulary says how well: certificate verified with the issuing body;
    certificate held, not verified; observed on site; knowledge check passed; attendance only.

roles:
  note: The roles at SESC-IMS-04 paragraph 11 and the trades at SESC-IMS-04 paragraph 14, plus the functions the signed policies name.
  values:
    - managing_director
    - chief_operating_officer
    - contracts_manager            # Quality Representative; Health and Safety Officer; Environmental Manager; regulation 7 competent person
    - accounts_manager             # Data Protection Lead; right-to-work and labour standards; sanctions screening
    - site_supervisor
    - operative_all_site           # every site operative in every trade
    - operative_roofing_fabric
    - operative_electrical
    - operative_gas_mechanical
    - operative_renewables         # solar PV; heat pumps; battery storage
    - operative_mould_damp         # mould and damp remediation (D11)
    - driver                       # anyone driving a company vehicle or a private vehicle for work
    - apprentice
    - subcontractor_person         # any subcontractor's person attending the Employer's sites
    - purchaser_receiver           # anyone who orders, receives, handles or installs materiel
    - rpe_wearer
    - first_aider
    - face_fit_tester
    - internal_auditor
    - everyone                     # all Staff, including all employees & subcontractors

evidence_vocabulary:
  source: SESC-FRM-03 competence_demonstrated
  values: [certificate held and verified with the issuing body, certificate held — not verified, observed on site, knowledge check passed, attendance only]

interval_vocabulary:
  values:
    - once, on engagement
    - per project or site
    - at least monthly
    - at least quarterly
    - at least annually
    - at least every three years
    - six-monthly
    - at the awarding body's interval — to be read from the awarding body
    - on the event

