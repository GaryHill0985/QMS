  # F — APPRENTICES AND SUBCONTRACTORS' PEOPLE
  # ===================================================================================

  - ref: CR-43
    requirement: Apprentice — a specific risk assessment before starting; a named mentor; no work beyond physical or psychological capacity; restricted hours; closer supervision; competence at each stage of the programme recorded
    roles: [apprentice]
    source: SESC-POL-10 paragraphs 10(e), 26(a); SESC-REG-09 CO-05 (regulation 19); SESC-IMS-05 paragraph 43(d)
