  # ===================================================================================
  # E — THE PEOPLE WHO OPERATE THE SYSTEM
  # ===================================================================================

  - ref: CR-38
    requirement: Regulation 7 competent person (Management of Health and Safety at Work Regulations 1999) — the appointed internal competent person, with qualifications reviewed annually and on any change of role by the Managing Director
    roles: [contracts_manager]
    source: SESC-POL-05 paragraphs 13, 117 and Annex C — "IOSH Safety for Executives and Directors, certificate 980-HSQE034-2881; Health and Safety for Directors to 30 Nov 2029; NVQ Level 4 Construction Site Supervision; NVQ Level 7; Temporary Works Coordinator to 29 Feb 2028" (appointment and competence reviewed annually; next review August 2027; verified S A Coffen 16 August 2026); SESC-REG-09 CO-03
    evidence: The certificates scheduled at SESC-POL-05 Annex C; the Managing Director's annual review recorded
    interval: at least annually (the review); each certificate at its awarding body's interval
    verified_by: Managing Director
    status: requirement documented and the holder's qualifications recorded in the signed document as verified against the certificates on 16 August 2026; not re-verified here; the next annual review is August 2027

  - ref: CR-39
    requirement: Retained external health and safety adviser — a recognised occupational health and safety qualification and membership of IOSH or an equivalent body at an appropriate grade
    roles: []   # not an Employer role; the requirement the Employer places on the adviser
    source: SESC-POL-05 paragraph 117 and Annex C — "James Milligan. NEBOSH National General Certificate in Occupational Health and Safety, awarded 25 March 2019, master log 00429184/1075579; Tech IOSH" (verified G A Hill 16 August 2026); engagement letter to be obtained
    evidence: The certificate and membership as scheduled at Annex C; the engagement letter
    interval: at least annually at the review of SESC-POL-05 Annex C
    verified_by: Chief Operating Officer
    status: requirement documented and the adviser's qualification recorded in the signed document; the engagement letter is not held (SESC-POL-05 Annex C; SESC-PRO-05 Part 8(j)). The adviser's competence is his, not the Employer's, and no audit qualification is claimed (SESC-PRO-02 paragraph 7)

  - ref: CR-40
    requirement: Quality Representative, Environmental Manager and Data Protection Lead — training appropriate to the duties
    roles: [contracts_manager, accounts_manager]
    source: SESC-POL-08 paragraph 90 ("The Environmental Manager and any person with specific environmental duties receive training appropriate to those duties, recorded in the Training Matrix"); SESC-POL-16 paragraph 7; SESC-POL-14 paragraph 7. NO signed document specifies a qualification for the Quality Representative, the Environmental Manager or the Data Protection Lead
    evidence: Training Matrix entries
    interval: not specified
    verified_by: Managing Director
    status: requirement stated only as "appropriate to the duties"; no qualification is specified and none is claimed; what training has been received is not read

  - ref: CR-41
    requirement: Internal auditor — competence and independence under SESC-PRO-02
    roles: [internal_auditor]
    source: SESC-PRO-02 paragraph 7 (competence of auditors — no audit qualification claimed for either prospective auditor) and paragraph 8 (independence allocation); Master Register D3 (open)
    evidence: As SESC-PRO-02 states once D3 is decided
    interval: as SESC-PRO-02 states
    verified_by: Managing Director (D3)
    status: requirement not yet settled — D3 open; no audit qualification claimed for anyone

  - ref: CR-42
