title: Competence Requirements Register — the qualification, card, registration, assessment, briefing or demonstrated ability each role must hold before a person in that role is given the work, with the source that requires it, the evidence that shows it and the interval at which it is renewed
version: "0.1"
status: draft
owner: Contracts Manager
approver: Managing Director
issued: 2026-10-26
revised: 2026-10-26
next_review: 2027-10-26
review_frequency_months: 12
classification: internal
clauses:
  iso9001:  ["7.2"]
  iso14001: ["7.2"]
  iso45001: ["7.2"]
parent_document: SESC-PRO-06
registers_cited: [SESC-REG-09, SESC-REG-10, SESC-REG-11]
review_trigger:
  - A change to the roles at SESC-IMS-04 paragraph 11 or the trades at SESC-IMS-04 paragraph 14
  - A change to any scheme requirement at SESC-POL-16 Annex C or SESC-POL-05 Annex C, or to the Employer's registrations
