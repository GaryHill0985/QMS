id: SESC-FRM-10
title: Fire Door Product Evidence Record
version: "0.1"
status: draft
owner: Contracts Manager
approver: Managing Director
issued: 2026-11-04
next_review: 2027-11-04
classification: internal
clauses:
  iso9001:  ["8.5.1", "8.5.2"]
personal_data: false
records_generated: [fire_door_product_evidence]
parent_document: SESC-PRO-08
one_per: door

completed_record:
  contains_personal_data: false
  store: >
    The job file, in the door's subfolder Fire Doors/<Door ID>/, with a copy of
    every evidence document it cites, and the records store. Never the repository.
  retention: As SESC-FRM-09
  feeds_register: SESC-REG-13 — the manufacturer and evidence reference columns

purpose: >
  Every component on a fire door is either the one the doorset's test evidence
  names, or it is not. This record answers that for each component before any
  of them is fitted. Hold point 3 of SESC-PRO-08: the Contracts Manager approves
  it with every row answered, and only then does installation start. A row that
  reads "does not match" stops the door.

guidance:
  - Fill this in from the manufacturer's documents on the job file, not from the packaging and not from memory.
  - The field-of-application check compares this door's survey (SESC-FRM-09) with what the evidence says the doorset may be installed in. If the opening, the wall, the leaf size or the configuration is outside it, stop.
  - Where the doorset came complete from one manufacturer, most rows cite the same evidence reference. Where a component came from elsewhere, the evidence must show that combination is permitted, and the row says which document shows it.
  - A "Not fitted" answer is honest only where the evidence and the specification do not call for the item.

print:
  per: door
  photo_stages: []

revision_history:
  - version: "0.1"
    date: 2026-11-04
    change: >
      First draft, alongside SESC-PRO-08. Drafted by Claude for G A Hill from
      HANDOFF-FD-001; not approved.

