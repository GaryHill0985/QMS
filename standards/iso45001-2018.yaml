standard: iso45001
edition: "2018"
title: "ISO 45001:2018 Occupational health and safety management systems — Requirements"
amendment: "Amd 1:2024 (climate action changes to 4.1 and 4.2)"
verified: true
verified_note: >
  Clause structure read from "ISO_ 45001-2018.pdf" held at Desktop\SESC\ISO\.
successor:
  status: "DIS ballot reached 9 August 2026; publication expected 2027"
  note: No reason to wait. Build to :2018.
warning: >
  45001 is the most document-hungry of the three standards. The FIVE dual
  "maintain AND retain" clauses below — 6.1.2.2, 6.1.3, 6.2.2, 8.1.1 c) and 8.2 —
  plus 10.3 e) "evidence of continual improvement", are the most commonly missed
  requirements in the whole set.

clauses:
  - id: "4.1"
    title: Understanding the organisation and its context
    note: 'Amd 1:2024 adds the climate change determination.'
  - id: "4.2"
    title: Understanding the needs and expectations of workers and other interested parties
  - id: "4.3"
    title: Determining the scope of the OH&S management system
    documented_information: maintain
  - id: "4.4"
    title: OH&S management system

  - id: "5.1"
    title: Leadership and commitment
  - id: "5.2"
    title: OH&S policy
    documented_information: maintain
  - id: "5.3"
    title: Organisational roles, responsibilities and authorities
    documented_information: maintain
  - id: "5.4"
    title: Consultation and participation of workers
    documented_information: retain
    critical: true
    note: >
      THE CLAUSE 45001 AUDITORS TEST HARDEST, and the one small firms fail. Requires a
      MECHANISM and records of it operating, with NON-MANAGERIAL workers. A paragraph in
      POL-05 will not pass. Nothing at SESC currently satisfies this.

  - id: "6.1.1"
    title: Actions to address risks and opportunities — general
    documented_information: maintain
  - id: "6.1.2.1"
    title: Hazard identification
  - id: "6.1.2.2"
    title: Assessment of OH&S risks and other risks to the OH&S management system
    documented_information: both
    dual_maintain_and_retain: true
  - id: "6.1.2.3"
    title: Assessment of OH&S opportunities and other opportunities
  - id: "6.1.3"
    title: Determination of legal requirements and other requirements
    documented_information: both
    dual_maintain_and_retain: true
    note: SESC's H&S legal register is dated 2020 and carries dead Z:\ drive links.
  - id: "6.1.4"
    title: Planning action
  - id: "6.2.1"
    title: OH&S objectives
    documented_information: maintain
  - id: "6.2.2"
    title: Planning to achieve OH&S objectives
    documented_information: both
    dual_maintain_and_retain: true

  - id: "7.1"
    title: Resources
  - id: "7.2"
    title: Competence
    documented_information: retain
  - id: "7.3"
    title: Awareness
  - id: "7.4.1"
    title: Communication — general
    documented_information: retain
  - id: "7.4.2"
    title: Internal communication
  - id: "7.4.3"
    title: External communication
  - id: "7.5.1"
    title: Documented information — general
  - id: "7.5.2"
    title: Creating and updating
  - id: "7.5.3"
    title: Control of documented information

  - id: "8.1.1"
    title: Operational planning and control — general
    documented_information: both
    dual_maintain_and_retain: true
    note: Sub-clause c) is the dual maintain-and-retain requirement.
  - id: "8.1.2"
    title: Eliminating hazards and reducing OH&S risks
  - id: "8.1.3"
    title: Management of change
  - id: "8.1.4.1"
    title: Procurement — general
  - id: "8.1.4.2"
    title: Contractors
    note: >
      Subcontractors carry out a significant proportion of SESC's work (POL-05 §158).
      No completed subcontractor assessment exists on file (SESC-REG-01 risk E4).
  - id: "8.1.4.3"
    title: Outsourcing
  - id: "8.2"
    title: Emergency preparedness and response
    documented_information: both
    dual_maintain_and_retain: true

  - id: "9.1.1"
    title: Monitoring, measurement, analysis and performance evaluation — general
    documented_information: retain
  - id: "9.1.2"
    title: Evaluation of compliance
    documented_information: retain
  - id: "9.2.1"
    title: Internal audit — general
  - id: "9.2.2"
    title: Internal audit programme
    documented_information: retain
    note: No internal audit has ever been carried out at SESC.
  - id: "9.3"
    title: Management review
    documented_information: retain
    note: Inputs (a) to (g) are all required. None minuted since 10 January 2023.

  - id: "10.1"
    title: Improvement — general
  - id: "10.2"
    title: Incident, nonconformity and corrective action
    documented_information: retain
    note: >
      No accident book existed before 31 August 2026. Accident book is separately a
      STATUTORY requirement where 10+ are normally employed — SI 1979/628 reg 25
      (Social Security (Claims and Payments) Regulations 1979), NOT SI 1979/141.
      Retain 3 years from date of entry. The open-page B1510 format breaches UK GDPR;
      use tear-out or electronic.
  - id: "10.3"
    title: Continual improvement
    documented_information: retain
    note: Sub-clause e) requires "evidence of continual improvement" as retained documented information.
