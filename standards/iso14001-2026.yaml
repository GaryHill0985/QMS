    note: >
      THE DEFINING ISO 14001 DOCUMENT, AND SESC'S HIGHEST-PRIORITY GAP. The aspects
      register currently held belongs to a landscaping firm — it names an unconnected
      individual, badgers and herbicides. It must be built from nothing, from SESC's own
      activities. POL-08 §14 already says so: "Any aspects register that does not describe
      the work SESC actually carries out must not be used."
