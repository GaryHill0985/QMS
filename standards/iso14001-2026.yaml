standard: iso14001
edition: "2026"
title: "ISO 14001:2026 Environmental management systems — Requirements with guidance for use"
verified: false
# ============================================================================
# ⚠  THIS FILE IS PROVISIONAL AND MUST NOT BE QUOTED TO A CUSTOMER OR AUDITOR
# ============================================================================
verified_note: >
  ISO 14001:2026 HAS NOT BEEN READ BY ANYONE ON THIS PROJECT. ISO 14001:2015 was
  WITHDRAWN on 15 April 2026 and the only copy held at Desktop\SESC\ISO\ is that
  withdrawn edition. The clause structure below is carried across from :2015 on the
  assumption that the Annex SL harmonised structure is unchanged. THAT ASSUMPTION IS
  UNTESTED. Every clause below carries verified: false until the 2026 edition is bought
  and read (decision D6). Do not let this file and the CertiKit v3 toolkit — which was
  built for the 2026 edition — drift apart silently.
certification_body_question: >
  THE SINGLE MOST IMPORTANT CB-SELECTION QUESTION, to be asked in writing of every
  certification body quoting: "Have you completed your UKAS accreditation extension for
  ISO 14001:2026, and if not, which tranche and what decision date?" Most UK CBs do not
  yet hold UKAS accreditation for :2026; the first decisions conclude 30 November 2026.
  Do not accept a :2015 certificate.

