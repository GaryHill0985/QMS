standard: iso9001
edition: "2015"
title: "ISO 9001:2015 Quality management systems — Requirements"
amendment: "Amd 1:2024 (climate action changes to 4.1 and 4.2)"
verified: true
verified_note: >
  Clause structure read from ISO_9001_2015(en).pdf held at Desktop\SESC\ISO\.
  NOTE: that copy is licensed to Unitspark Ltd, single user. SESC must buy its own
  (decision D6). The clause NUMBERING below is a matter of public record and is not
  in doubt; the clause TEXT must not be reproduced from the third-party copy.
successor:
  edition: "2026"
  publishes: 2026-09-16
  note: >
    Accredited certification to 9001:2026 is unlikely before mid/late 2027 and the
    transition period is NOT published — no Global ACI mandatory document and no UKAS
    technical bulletin exists. Certify to :2015, write 2026-ready. See CLAUDE.md §6.

clauses:
  - id: "4.1"
    title: Understanding the organisation and its context
    documented_information: false
    note: >
      Amd 1:2024 adds: "The organization shall determine whether climate change is a
      relevant issue." For a building services contractor a "not relevant" conclusion
      is not defensible.
  - id: "4.2"
    title: Understanding the needs and expectations of interested parties
    documented_information: false
    note: 'Amd 1:2024 adds: "Relevant interested parties can have requirements related to climate change."'
